# v2 grammatical constructions for the Phase 5 gloss rule engine. English -> ordered
# ASL gloss + non-manual tags. Examples use only the 60 signs above, and reference
# them by ID-GLOSS (WANT_2, WHAT_1 -- not bare WANT/WHAT), so the composer resolves
# to exactly one sign. NMM = non-manual marker.
# NOTE: these are an approximation of a living language and are gated on Deaf review
# before any correction built from them is shown to a user as authoritative.
constructions_v2:
  - id: time_first
    name: Time-first
    description: >
      Time signs move to the front of the clause; the rest follows in topic-
      comment or SVO order.
    non_manual: none
    example_english: I work today.
    example_gloss: TODAY ME WORK
  - id: topic_comment
    name: Topic-comment
    description: >
      Front a noun as the topic (marked by brow raise + slight pause), then
      comment on it.
    non_manual: brow_raise over the topic
    example_english: I want coffee.
    example_gloss: "COFFEE, ME WANT_2 ^brow_raise-on-topic"
  - id: yes_no_question
    name: Yes/no question
    description: >
      Signed word order is unchanged; the whole clause is marked non-manually
      with raised brows (and often a forward head tilt).
    non_manual: brow_raise + head-forward over the whole clause
    example_english: Are you tired?
    example_gloss: YOU TIRED ^brow_raise
  - id: wh_question
    name: Wh-question
    description: >
      The wh-sign typically comes clause-finally (sometimes doubled), marked
      with lowered/furrowed brows.
    non_manual: brow_furrow over the clause; wh-sign clause-final
    example_english: What is your name?
    example_gloss: YOUR NAME WHAT_1 ^brow_furrow
  - id: negation
    name: Negation
    description: >
      Negate by marking the predicate with a headshake (and optionally the NO
      sign); word order is otherwise unchanged.
    non_manual: headshake over the negated predicate
    example_english: "I don't want coffee."
    example_gloss: "ME WANT_2 COFFEE ^headshake  (or: ME WANT_2 COFFEE NO)"
