# Contrastive minimal pairs: signs differing in exactly ONE phonological parameter.
# When the learner model detects a confusion between two such signs, the task
# generator fires a contrastive drill on the differing parameter (Phase 6).
#
# DERIVED -- machine-generated from the vectors above. DO NOT HAND-EDIT; the
# previous hand-written list had 6 of 16 pairs differing in two parameters, which
# would have drilled an un-isolated contrast. Regenerate after any vocab change.
#
# Rules: a pair is minimal on F iff it differs on F and agrees on every other
# field in [handshape, major_location, minor_location, movement, repeated,
# sign_type] -- except that major_location pairs are exempt from matching
# minor_location, since minor is nested inside major.
contrastive_pairs:
  handshape:   # 40
    - pair: [baby, today]
      differs: "open_b vs y"
    - pair: [baby, what_1]
      differs: "open_b vs 5"
    - pair: [black, hello]
