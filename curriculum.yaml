# Contrastive minimal pairs: signs differing in exactly ONE phonological parameter.
# When the learner model detects a confusion between two such signs, the task
# generator fires a contrastive drill on the differing parameter (Phase 6).
contrastive_pairs:
  handshape:
    - pair: [you, your]
      differs: "1 vs 5"
    - pair: [you, "yes"]
      differs: "1 vs s"
    - pair: ["yes", ok]
      differs: s vs o
    - pair: [blue, green]
      differs: closed_b vs g
    - pair: [green, yellow]
      differs: g vs y
    - pair: [yellow, dog]
      differs: y vs d
    - pair: [blue, milk]
      differs: closed_b vs s
  major_location:
    - pair: [me, he]
      differs: Body vs Neutral
    - pair: [me, black]
      differs: Body vs Head
    - pair: [he, black]
      differs: Neutral vs Head
  minor_location:
    - pair: [mother, father]
      differs: Chin vs Forehead
    - pair: [who, sister]
      differs: Chin vs CheekNose
  movement:
    - pair: [me, we]
      differs: Straight vs Curved
    - pair: [my, happy]
      differs: Straight vs Curved
    - pair: [my, please]
      differs: Straight vs Circular
    - pair: [please, happy]
      differs: Circular vs Curved

# v2 grammatical constructions for the Phase 5 gloss rule engine. English -> ordered
# ASL gloss + non-manual tags. Examples use only the 60 signs above.
# NOTE: these are an approximation of a living language and are gated on Deaf review
# before any correction built from them is shown to a user as authoritative.
constructions_v2:
  - id: time_first
    name: Time-first
    description: >
      Time signs move to the front of the clause; the rest follows in topic-
      comment or SVO order.
    non_manual: none
    example_english: I work today.
    example_gloss: TODAY ME WORK
  - id: topic_comment
    name: Topic-comment
    description: >
      Front a noun as the topic (marked by brow raise + slight pause), then
      comment on it.
    non_manual: brow_raise over the topic
    example_english: I want coffee.
    example_gloss: "COFFEE, ME WANT ^brow_raise-on-topic"
  - id: yes_no_question
    name: Yes/no question
    description: >
      Signed word order is unchanged; the whole clause is marked non-manually
      with raised brows (and often a forward head tilt).
    non_manual: brow_raise + head-forward over the whole clause
    example_english: Are you tired?
    example_gloss: YOU TIRED ^brow_raise
  - id: wh_question
    name: Wh-question
    description: >
      The wh-sign typically comes clause-finally (sometimes doubled), marked
      with lowered/furrowed brows.
    non_manual: brow_furrow over the clause; wh-sign clause-final
    example_english: What is your name?
    example_gloss: YOUR NAME WHAT ^brow_furrow
  - id: negation
    name: Negation
    description: >
      Negate by marking the predicate with a headshake (and optionally the NO
      sign); word order is otherwise unchanged.
    non_manual: headshake over the negated predicate
    example_english: "I don't want coffee."
    example_gloss: "ME WANT COFFEE ^headshake  (or: ME WANT COFFEE NO)"
