# ==========================================================================
# curriculum.yaml  --  Phase 0 output (curriculum scope)
#
# The vocabulary that defines the label set, and therefore which references to
# ingest (Phase 1) and everything downstream. This is a scope document, not the
# grounded answer key itself -- the answer key is the reference video + pose
# sequences in data/ (Phase 1). Here I only decide WHAT to teach and in what order.
#
# PROVENANCE -- three tiers, do not mix them:
#   1. VERBATIM FROM ASL-LEX 2.0 (data/ASL_LEX): handshape, major_location,
#      minor_location, movement, repeated, sign_type, lexical_class.
#      These describe the FIRST MORPHEME of each sign (see caveats.first_morpheme).
#   2. AUTHOR-ADDED, UNVERIFIED: english_lemmas, verb_class. Gated on Deaf review
#      (verb_class) -- see status.verb_class_verified.
#   3. DERIVED: coverage, contrastive_pairs. Machine-generated from tier 1 by
#      tools/validate_curriculum.py -- never hand-edit; regenerate.
# ==========================================================================

version: 0.2
count: 60

principle: >
  Grounded answer key, dynamic everything else. This file fixes only the sign
  list, introduction order, and v2 constructions; diagnosis, sequencing, and
  practice are generated live against real Deaf-signer references.

changelog:
  - "0.2: contrastive_pairs regenerated from the phonological vectors (6 of the 16"
  - "     hand-written pairs were not minimal). translation -> english_lemmas (the"
  - "     old field just echoed the gloss and could not feed the 5b lexicon)."
  - "     Added verb_class. Construction examples now use ID-glosses. units"
  - "     reframed as an unlock graph, not a fixed lesson order. Added"
  - "     backfill_from_asllex for the fields the grader needs but this file lacks."

sources:
  vocabulary_and_recognizability: "ASL-LEX 2.0 (SignFrequency, PercentUnknown, phonology)"
  reference_video: "ASL Citizen (Phase 1) -- consented, Deaf-involved, domain-matched"
  naming_authority: "ASL SignBank ID-glosses (ASL-LEX is cross-referenced to it)"

selection_criteria:
  - "Beginner usefulness: high subjective SignFrequency, low PercentUnknown (<= 0.10)."
  - "Phonological diversity: cover all 5 major locations and a broad handshape set,"
  - "so contrastive minimal-pair drills have material to work with."

status:
  asl_citizen_confirmed: true # confirmed by tools/resolve_keys.py: all 60 signs resolve to a unique ASL-LEX Code present in the ASL Citizen splits. 5 signs auto-selected a Citizen variant -- see variant_reviewed.
  verb_class_verified: false     # TODO: author-assigned plain/agreement/spatial.
                                 # Gated on Deaf review before any correction built
                                 # on it is shown to a user as authoritative.
  english_lemmas_reviewed: false # TODO: English-side mapping for the 5b lexicon.
                                 # Widen with synonyms as the rule engine needs.

caveats:
  first_morpheme: >
    ASL-LEX phonology describes the FIRST MORPHEME only. For multi-morphemic
    signs the parameters below are therefore incomplete, and parameter-level
    diagnosis against them would be wrong for the later morphemes. Before Phase 4,
    flag multi-morphemic signs (check the ASL-LEX morpheme/compound column) and
    either exclude them from parameter-level feedback or annotate the full form.
  lexical_class_is_not_english_pos: >
    lexical_class is ASL-LEX's class for the SIGN, not the POS of the English
    prompt word (e.g. drink is coded Noun while sitting in the verbs unit; home
    is Adverb). The 5b rule engine must take English POS from spaCy and use
    lexical_class only for ASL-side decisions. Never cross the two.
  minor_location_drill_material: >
    Only ONE true minor_location minimal pair exists in this vocabulary
    (mother/father). If minor-location diagnosis matters, add signs that contrast
    within a major region -- otherwise the contrastive drill for that parameter
    has almost nothing to fire on.

# Fields the grader's phonological heads need (see project_workflow.md Phase 4)
# that are NOT in this file. Backfill from the ASL-LEX CSV -- do not invent them.
# Confirm the exact column names against data/ASL_LEX before writing the join.
backfill_from_asllex:
  - selected_fingers      # more actionable than a single handshape label
  - flexion               # "fingers right, flexion off" is real feedback
  - nondominant_handshape # required for the AsymmetricalDifferentHandshape signs
  - orientation           # listed as a grader head; absent here
  - sign_frequency        # cited in selection_criteria but not recorded
  - percent_unknown       # cited in selection_criteria but not recorded

# Coverage of the chosen 60 across ASL-LEX's phonological parameter space.
# DERIVED -- regenerate with tools/validate_curriculum.py.
coverage:
  major_location: {Neutral: 24, Head: 18, Body: 11, Hand: 6, Arm: 1}
  distinct_handshapes: 20
  movement: {Straight: 33, None: 12, Curved: 11, Circular: 3, Other: 1}

# The parameter vocabularies the grader's phonological heads predict (from ASL-LEX).
parameter_space:
  major_location: [Neutral, Head, Body, Hand, Arm]
  movement: [Straight, Curved, Circular, None, BackAndForth, Z-shaped, X-shaped, Other]
  handshapes_in_curriculum: ["1", "5", "a", bent_1, "c", closed_b, curved_1, "d", "f", flat_h, flatspread_5, "g", "h", "l", "o", open_b, "s", "v", "w", "y"]

# Introduction order (an UNLOCK GRAPH, not a fixed lesson path). A unit's signs
# become available for practice once the preceding units are unlocked; the Phase 6
# adaptive engine still chooses WHAT to drill among unlocked material, from the
# learner's gaps. Nothing here fixes the sequence a learner actually experiences.
units:
  - id: 1
    name: Pronouns & pointing
    rationale: >
      Deixis first: every later sentence needs a subject/object. All share the
      '1' handshape, so early practice isolates location and movement, not ha
      ndshape.
    signs:
      - gloss: you
        asllex_id: you
        asllex_code: D_02_065
        asl_citizen_gloss: YOU
        english_lemmas: [you]
        lexical_class: Minor
        handshape: "1"
        major_location: Neutral
        minor_location: Neutral
        movement: Straight
        repeated: false
        sign_type: OneHanded
      - gloss: me
        asllex_id: me
        asllex_code: B_01_068
        asl_citizen_gloss: ME
        english_lemmas: [me, i]
