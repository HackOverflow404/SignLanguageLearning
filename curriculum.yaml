# ==========================================================================
# curriculum.yaml  --  Phase 0 output (curriculum scope)
#
# The vocabulary that defines the label set, and therefore which references to
# ingest (Phase 1) and everything downstream. This is a scope document, not the
# grounded answer key itself -- the answer key is the reference video + pose
# sequences in data/ (Phase 1). Here I only decide WHAT to teach and in what order.
#
# Phonological fields (handshape / *_location / movement / sign_type) are copied
# verbatim from ASL-LEX 2.0 (data/ASL_LEX) and describe the FIRST morpheme of each
# sign. They are the target parameters the grader diagnoses and the axes the
# contrastive drills contrast on.
# ==========================================================================

version: 0.1
count: 60

principle: >
  Grounded answer key, dynamic everything else. This file fixes only the sign
  list, ordering, and v2 constructions; diagnosis, sequencing, and practice are
  generated live against real Deaf-signer references.

sources:
  vocabulary_and_recognizability: "ASL-LEX 2.0 (SignFrequency, PercentUnknown, phonology)"
  reference_video: "ASL Citizen (Phase 1) -- consented, Deaf-involved, domain-matched"

selection_criteria:
  - "Beginner usefulness: high subjective SignFrequency, low PercentUnknown (<= 0.10)."
  - "Phonological diversity: cover all 5 major locations and a broad handshape set,"
  - "so contrastive minimal-pair drills have material to work with."

status:
  asl_citizen_confirmed: false   # TODO: confirm every gloss against ASL Citizen's
                                 # gloss list once the download finishes and is
                                 # extracted, and map asllex_id -> ASL Citizen gloss.
                                 # (ASL Citizen's 2,731 signs are drawn from ASL-LEX,
                                 # so overlap is expected, but confirm before Phase 1.)

# Coverage of the chosen 60 across ASL-LEX's phonological parameter space.
coverage:
  major_location: {Neutral: 24, Head: 18, Body: 11, Hand: 6, Arm: 1}
  distinct_handshapes: 20
  movement: {Straight: 32, Curved: 12, None: 12, Circular: 3, Other: 1}

# The parameter vocabularies the grader's phonological heads predict (from ASL-LEX).
parameter_space:
  major_location: [Neutral, Head, Body, Hand, Arm]
  movement: [Straight, Curved, Circular, None, BackAndForth, Z-shaped, X-shaped, Other]
  handshapes_in_curriculum:
    ["1", "5", open_b, closed_b, flat_h, flatspread_5, s, a, c, o, l, y, h, v,
     w, g, d, f, curved_1, bent_1]

# Teaching order: units are taught top to bottom; signs within a unit top to bottom.
units:
  - id: 1
    name: "Pronouns & pointing"
    rationale: >
      Deixis first: every later sentence needs a subject/object. All share the
      '1' handshape, so early practice isolates location and movement, not
      handshape.
    signs:
      - gloss: you
        asllex_id: you
        translation: you
        lexical_class: Minor
        handshape: "1"
        major_location: Neutral
        minor_location: Neutral
        movement: Straight
        repeated: false
        sign_type: OneHanded
      - gloss: me
        asllex_id: me
        translation: me
        lexical_class: Minor
        handshape: "1"
        major_location: Body
        minor_location: TorsoTop
        movement: Straight
        repeated: false
        sign_type: OneHanded
      - gloss: he
        asllex_id: he
        translation: he
        lexical_class: Minor
        handshape: "1"
        major_location: Neutral
        minor_location: Neutral
        movement: Straight
        repeated: false
        sign_type: OneHanded
      - gloss: we
        asllex_id: we
        translation: we
        lexical_class: Minor
        handshape: "1"
        major_location: Body
        minor_location: Clavicle
        movement: Curved
        repeated: false
        sign_type: OneHanded
      - gloss: my
        asllex_id: my
        translation: my
        lexical_class: Minor
        handshape: open_b
        major_location: Body
        minor_location: TorsoTop
        movement: Straight
        repeated: false
        sign_type: OneHanded
      - gloss: your
        asllex_id: your
        translation: your
        lexical_class: Minor
        handshape: "5"
        major_location: Neutral
        minor_location: Neutral
        movement: Straight
        repeated: false
        sign_type: OneHanded

  - id: 2
    name: Question words
    rationale: >
      Enables interaction immediately and seeds the v2 wh-question
      construction. Handshape-diverse (5, l, 1, y, c) at Head/Neutral.
    signs:
      - gloss: what_1
        asllex_id: what_1
        translation: what_1
        lexical_class: Minor
        handshape: "5"
        major_location: Neutral
